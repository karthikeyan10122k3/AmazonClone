<div class="container-fluid mt-3">
  <div class="row">
    <!-- Shopping Cart Container -->
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-light">
          <h3>Shopping Cart</h3>
        </div>
        <div class="card-body">
          <app-cart-card 
            *ngFor="let item of cartItems"
            [cartItem]="item">
          </app-cart-card>
        </div>
      </div>
    </div>

    <!-- Subtotal Container -->
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-light">
          <h5>Order Summary</h5>
        </div>
        <div class="card-body">
          <p class="text-success" *ngIf="cartLength > 0">
            <i class="fa-solid fa-check"></i> Your order is eligible for FREE Delivery.
          </p>
          <p class="text-danger" *ngIf="cartLength === 0">
            <i class="fa-solid fa-xmark"></i> Cart is Empty.
          </p>
          <p>Subtotal ({{ cartLength }} items): <strong>{{ subtotal | currency:'INR' }}</strong></p>
          <button class="btn btn-warning w-100" (click)="proceedToBuy()" [disabled]="cartLength === 0">Proceed to Buy</button>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Ordered Products Section -->
<div class="row mt-4" *ngIf="ordersLength > 0">
  <div class="col-12">
    <div class="card border-0 shadow">
      <div class="card-header bg-light py-3 border-bottom">
        <h5 class="mb-0">Your Previous Orders</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <div
            class="col-sm-6 col-md-4 col-lg-3 mb-4"
            *ngFor="let orderItem of orderItems"
          >
            <div class="card h-100 shadow-sm border-0 rounded-3">
              <a
                [routerLink]="['/product-details', orderItem.product.id]"
                class="d-block"
              >
                <img
                  [src]="orderItem.product.thumbnail"
                  [alt]="orderItem.product.title"
                  class="card-img-top rounded-top"
                  style="height: 160px; object-fit: cover"
                />
              </a>
              <div class="card-body p-3">
                <a
                  [routerLink]="['/product-details', orderItem.product.id]"
                  class="text-decoration-none"
                >
                  <h6 class="card-title mb-2 text-dark" style="font-size: 15px">
                    {{ orderItem.product.title }}
                  </h6>
                </a>
                <p class="mb-1 text-muted" style="font-size: 13px">
                  <strong>Price:</strong>
                  {{ orderItem.product.price | currency: 'INR' }}
                </p>
                <p class="mb-3 text-muted" style="font-size: 13px">
                  <strong>Quantity:</strong> {{ orderItem.quantity }}
                </p>
                <button
                  class="btn btn-outline-primary btn-sm w-100"
                  (click)="buyAgain(orderItem.product)"
                >
                  Buy Again
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
